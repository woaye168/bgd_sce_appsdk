[package]
name = "bgd_appsdk"
version = "0.1.0"
edition = "2021"
description = "BGD SCE 应用公共 SDK：单实例/看守线程/日志/配置/通用 UI（供 sce_app_* 应用复用）"

[lib]
name = "bgd_appsdk"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
eframe = "0.29"
egui = "0.29"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }
