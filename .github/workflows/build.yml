name: Build Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        plugin: [visual-injector]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build plugin
        run: |
          cd plugins/${{ matrix.plugin }}
          cargo build --release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}
          path: plugins/${{ matrix.plugin }}/target/release/*.dll

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Read version notes
        id: notes
        run: |
          if (Test-Path version.txt) {
            $content = Get-Content version.txt -Raw
            echo "NOTES<<EOF" >> $env:GITHUB_OUTPUT
            echo "$content" >> $env:GITHUB_OUTPUT
            echo "EOF" >> $env:GITHUB_OUTPUT
          } else {
            echo "NOTES=Release v${{ steps.version.outputs.VERSION }}" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.dll
          body: ${{ steps.notes.outputs.NOTES }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update registry.json
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $registry = Get-Content registry.json -Raw | ConvertFrom-Json
          foreach ($plugin in $registry.plugins) {
            $plugin.version = $version
            $plugin.download_url = "https://github.com/woaye168/bgd_sce_plugins/releases/download/v$version/$($plugin.id -replace '-','_').dll"
          }
          $registry | ConvertTo-Json -Depth 10 | Set-Content registry.json -Encoding UTF8
        shell: pwsh

      - name: Commit registry.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore: registry.json 更新到 v${{ steps.version.outputs.VERSION }} [skip ci]" || exit 0
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
