name: Build Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        plugin: [visual-injector]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build plugin
        run: |
          cd plugins/${{ matrix.plugin }}
          cargo build --release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}
          path: plugins/${{ matrix.plugin }}/target/release/*.dll

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史，用于归纳版本间提交

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Generate release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $prev = git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1
          $range = if ($prev) { "$prev..$tag" } else { "$tag" }
          $commits = git log $range --pretty=format:"- %s (``%h``)" --no-merges
          $lines = @()
          $lines += "## 版本说明"
          $lines += ""
          if ($prev) { $lines += "本版本相对 ``$prev`` 的全部变更如下：" } else { $lines += "首个版本，包含全部提交：" }
          $lines += ""
          $lines += "### What's Changed"
          $lines += ""
          if ($commits) { $lines += $commits } else { $lines += "- 无代码变更" }
          $lines += ""
          if ($prev) { $lines += "**Full Changelog**: https://github.com/$repo/compare/$prev...$tag" }
          $body = $lines -join "`n"
          "body<<EOF" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: notes

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.dll
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update registry.json
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $registry = Get-Content registry.json -Raw | ConvertFrom-Json
          foreach ($plugin in $registry.plugins) {
            $plugin.version = $version
            $plugin.download_url = "https://github.com/woaye168/bgd_sce_plugins/releases/download/v$version/$($plugin.id -replace '-','_').dll"
          }
          $registry | ConvertTo-Json -Depth 10 | Set-Content registry.json -Encoding UTF8
        shell: pwsh

      - name: Commit registry.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git diff --cached --quiet || git commit -m "chore: registry.json 更新到 v${{ steps.version.outputs.VERSION }} [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
